name: supabase-sync

# Fills the Supabase database from the airport board + radar network.
# Each run sweeps radar for ~4.4 minutes, so back-to-back runs give
# effectively continuous ~15 second coverage. Free for public repos.

on:
  schedule:
    # Every 30 min. Each run sweeps for ~3 h and cancel-in-progress replaces the
    # previous one, so coverage is continuous whether GitHub honours this
    # schedule or throttles it to 90 minutes. A tighter cron would only restart
    # a healthy run and lose ~30 s to checkout each time.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test the pipeline without writing to the database"
        type: boolean
        default: false

permissions:
  contents: read

# Each run sweeps for ~4.4 min on a 5 min schedule, so runs routinely overlap.
# With cancel-in-progress:false GitHub keeps only ONE pending run and cancels
# older queued ones, so scheduled runs were silently killing each other and
# leaving multi-hour gaps in coverage. Cancelling the in-progress run instead
# means the newest data always wins: a superseded sweep has already done its
# work, all writes are idempotent upserts, and the replacement starts sampling
# immediately. Freshness beats letting a stale sweep finish.
concurrency:
  group: supabase-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Each run sweeps radar for ~3 hours (see RUN_MS). Actions is free and
    # unlimited on public repos, so a long job costs nothing and is the only
    # way to get continuous coverage out of a schedule GitHub throttles to
    # every 45-90 minutes.
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync flights to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/sync-supabase.mjs
