name: radar collector

# Fills the Supabase database from the airport board + radar network.
# This file is the worker. It is never scheduled directly - the radar-lane-*
# workflows call it. See radar-lane-a.yml for why there are three of them.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test the pipeline without writing to the database"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # One run sweeps for 5.5 h (see RUN_MS). GitHub's ceiling for a job is 6 h,
    # and Actions is free and unlimited on public repos, so the longest run the
    # platform allows is also the cheapest way to survive a missed schedule.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync flights to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/sync-supabase.mjs
